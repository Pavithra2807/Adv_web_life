        <h1>Login form</h1>

            <input type="tel" name="utel" placeholder="Enter the Mobile Nummber" minlength="6" maxlength="12"> <br> <br>

            <input type="radio" name="Gender" value="Female"> Female

            <button>Submit</button>

        </form>
