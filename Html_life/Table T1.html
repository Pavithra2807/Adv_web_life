<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Learn Complex HTML Tables</h1>
    <table border="3" cellpadding="5">
        <caption>Complex Table</caption>
        <tr>
            <th rowspan="5">alpha</th>
            <th colspan="5">Beta</th>
        </tr>
        <tr>
            <th rowspan="2">Gamma</th>
            <th colspan="2">Tilde</th>
            <th colspan="2">Lambda</th>
        </tr>
        <tr>
            <th>1</td>
            <th>2</th>
            <th>3</th>
            <th>4</th>
        </tr>
        <tr>
            <th rowspan="2">Zetta</th>
            <th colspan="2">Delta</th>
            <th colspan="2">Theta</th>
        </tr>
        <tr>
            <th colspan="2">Omega</th>
            <th colspan="2">Kappa</th>
        </tr>
    </table>
</body>
</html>
