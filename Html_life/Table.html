<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="3" cellpadding="10" cellspacing="10">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
    </table>


    <b>Unstructured table with rowspan</b>
    <table border="3" cellpadding="10" cellspacing="10">
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td>6</td>
            <td>7</td>
            <td>8</td>
        </tr>
    </table>

    <b>Unstructured table with colspan</b>
    <table border="3" cellpadding="10" cellspacing="10">
        <tr>
            <td colspan="2">1</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
        <tr>
            
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
    </table>

    <b>Structured table with heading</b>

    <table border="3" cellpadding="10" cellspacing="10">
            <tr>
                <th>sl.no</th>
                <th>name</th>
                <th>%</th>
            </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
    </table>


    <b>Structured table with heading,body,footer</b>
    <table border="3" cellpadding="10" cellspacing="10">
        <thead>
            <tr>
                <th>sl.no</th>
                <th>name</th>
                <th>%</th>
            </tr>
        </thead>

        <tbody>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total 100%</td>
            </tr>
        </tfoot>
    </table>




    
</body>
</html>
