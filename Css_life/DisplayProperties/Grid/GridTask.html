<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .main{
            border:  solid white;
            display: grid;
            grid-template-columns: 200px 200px 200px 200px 200px;
            gap: 5px 5px;
            height: 500px;  
        }

        .box{
            border: 2px solid;
            padding: 20px;
            background-color: greenyellow;
        }

        #box-1{
            background-color: red;
            grid-row: 1/3;
        }
        #box-2{
            background-color: aqua;
            grid-column: 2/4;
        }
        #box-3{
            background-color: orange;
            grid-column: 4/6;
        }
        #box-8{
            background-color: whitesmoke;
            grid-row: 3/5;
        }
        #box-4{
            background-color: orange;
            grid-row: 2/4;
            grid-column: 2/3;
        }
        #box-5{
            background-color: whitesmoke;
            grid-row: 2/4;
            grid-column: 3/5;
        }
        #box-6{
            background-color: red;
            grid-row: 2/6;
            grid-column: 5/6;
        }
        #box-7{
            background-color: red;
            grid-row: 2/5;
            grid-column: 5/6;
        }
        #box-9{
            background-color: red;
            grid-row: 4/5;
            grid-column: 2/4;
        }
        #box-10{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box" id="box-1">b1</div>
        <div class="box" id="box-2">b2</div>
        <div class="box" id="box-3">b3</div>
        <div class="box" id="box-4">b4</div>
        <div class="box" id="box-5">b5</div>
        <div class="box" id="box-7">b7</div>
        <div class="box" id="box-8">b8</div>
        <div class="box" id="box-9">b9</div>
        <div class="box" id="box-10">b10</div>
    </div>
</body>
</html>
