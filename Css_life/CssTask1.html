<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sc{
            width:500px;
            border: 1px solid white;
            border-radius: 4px;
        }
        .bg{
            height: 180px;
            background-color: gold;
            position: relative;
        }
        .icon{
            font-size: 40px;
            position: absolute;
            left: 215px;
            top:50px;
        }
        .ImgBox img{
            border: 3px solid black;
            border-radius: 15px;
            width: 100px;
            height: 100px;
            position: absolute;
            top:140px;
            left:20px;
        }
        .name{
            position: absolute;
            left:130px;
            font-size: x-large;
            color:maroon;
            top: 200px;
            font-family:'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <div class="sc">
        <div class="bg">
            <div class="icon">📸</div>
        </div>
        <div class="ImgBox">
            <img src="./profile .jpeg">
        </div>
        <div class="name">Pavithra</div>
    </div>
</body>
</html>
