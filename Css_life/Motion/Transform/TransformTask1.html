<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: black;
            box-sizing: border-box;
        }
        html,body{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 600px;
            height: 550px;
            border: 2px white dotted;
        }
        .child{
            width: 100px;
            height: 100px;
            background-color: cadetblue;
        }
        img{
            width: 100px;
            height: 100px;
            border: 2px solid white;
        }
        #a{
            transform: translate(10px,10px);
        }
        #b{
            transform: translate(120px,20px) scaleX(1.5);
        }
        #c{
            transform: translate(250px,30px) rotate(45deg);
        }
        #d{
            transform: translate(120px,20px) scaleX(1.5);
        }
        #e{
            transform: translate(10px,30px);
        }
        #f{
            transform: translate(490px,-490px);
        }
        #g{
            transform: translate(380px,-480px) scaleX(1.5);
        }
        #h{
            transform: translate(380px,-380px) scaleX(1.5);
        }
        #i{
            transform: translate(490px,-370px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child" id="a">
            <img src="./images1.jpg" alt="">
        </div>
        <div class="child" id="b">
            <img src="./imgg1.jpeg" alt="">
        </div>
        <div class="child" id="c">
            <img src="./imgi_1_4_SdjkdS98aKH76I8eD0_qjw.png" alt="">
        </div>
        <div class="child" id="d">
            <img src="./profile .jpeg" alt="">
        </div>
        <div class="child" id="e">
            <img src="./WhatsApp Image 2026-07-11 at 10.14.40 AM.jpeg" alt="">
        </div>
        <div class="child" id="f">
            <img src="./q.jpeg" alt="">
        </div>
        <div class="child" id="g">
            <img src="./WhatsApp Image 2026-07-11 at 10.14.41 AM (1).jpeg" alt="">
        </div>
        <div class="child" id="h">
            <img src="./WhatsApp Image 2026-07-11 at 10.14.41 AM (2).jpeg" alt="">
        </div>
        <div class="child" id="i">
            <img src="./WhatsApp Image 2026-07-11 at 10.14.41 AM.jpeg" alt="">
        </div>
    </div>
</body>
</html>
