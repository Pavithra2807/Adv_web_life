<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: black;
            box-sizing: border-box;
        }
        html,body{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 650px;
            height: 550px;
            border: 3px white dotted;
            border-radius: 10px;
        }
        .child{
            width: 100px;
            height: 100px;
        }
        img{
            width: 100px;
            height: 100px;
            border: 2px solid white;
            border-radius: 10px;
            box-shadow: 2px 2px 3px white;
        }
        #a {
            transform: translate(10px,10px);
        }
        #b{
            transform: translate(150px,20px) scaleX(1.5);
        }
        #c{
            transform: translate(280px,30px) rotate(45deg);
        }
        #d{
            transform: translate(150px,20px) scaleX(1.5);
        }
        #e{
            transform: translate(10px,35px);
        }
        #f{
            transform: translate(538px,-490px);
        }
        #g{
            transform: translate(400px,-480px) scaleX(1.5);
        }
        #h{
            transform: translate(400px,-380px) scaleX(1.5);
        }
        #i{
            transform: translate(538px,-370px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child" id="a">
            <img src="./stefan.webp"alt="">
        </div>
        <div class="child" id="b">
            <img src="./Elena.webp" alt="">
        </div>
        <div class="child" id="c">
            <img src="./blood.jpg" alt="">
        </div>
        <div class="child" id="d">
            <img src="./elijah.jpg" alt="">
        </div>
        <div class="child" id="e">
            <img src="./hayley.jpg" alt="">
        </div>
        <div class="child" id="f">
            <img src="./damon.jpg" alt="">
        </div>
        <div class="child" id="g">
            <img src="./caroline.jpg" alt="">
        </div>
        <div class="child" id="h">
            <img src="./bonnie.jpg" alt="">
        </div>
        <div class="child" id="i">
            <img src="./klause.jpg" alt="">
        </div>
    </div>
</body>
</html>
