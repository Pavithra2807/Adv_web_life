<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            background-color:black;
            box-sizing: border-box;
        }
        html,body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
        }
        .main {
            display: flex;
            position: relative;
        }

        .container {
            width: 200px;
            height: 500px;
            border: 3px white dotted;
            flex-shrink: 0;
        }

        .child {
            position: absolute;
            width: 70px;
            height: 70px;
            background-color:rgb(216, 63, 89);
            border-radius: 20%;
            border: 2px solid rgb(216, 63, 89);
            animation-name: pavii;
            animation-duration: 11s;
            animation-timing-function: ease-in;
            animation-iteration-count: infinite;
            box-shadow: 3px 3px 5px rgb(216, 63, 89);
        }

        #a {
            border-top: none;
        }
        #b {
            border-bottom: none;
        }
        #c {
            border-top: none;
        }
        #d {
            border-bottom: none;
        }
        #e {
            border-top: none;
        }

        @keyframes pavii {
            0% {
                transform: translate(0px, 0px);
            }
            2.5% {
                transform: translate(200px, 0px);
            }
            5% {
                transform: translate(0px, 80px);
            }
            7.5% {
                transform: translate(200px, 160px);
            }
            10% {
                transform: translate(0px, 240px);
            }
            12.5% {
                transform: translate(200px, 320px);
            }
            15% {
                transform: translate(0px, 400px);
            }
            17.5% {
                transform: translate(200px, 480px);
            }


            20% {
                transform: translate(200px, 0px);
            }
            22.5% {
                transform: translate(400px, 0px);
            }
            25% {
                transform: translate(200px, 80px);
            }
            27.5% {
                transform: translate(400px, 160px);
            }
            30% {
                transform: translate(200px, 240px);
            }
            32.5% {
                transform: translate(400px, 320px);
            }
            35% {
                transform: translate(200px, 400px);
            }
            37.5% {
                transform: translate(400px, 480px);
            }


            40% {
                transform: translate(400px, 0px);
            }
            42.5% {
                transform: translate(600px, 0px);
            }
            45% {
                transform: translate(400px, 80px);
            }
            47.5% {
                transform: translate(600px, 160px);
            }
            50% {
                transform: translate(400px, 240px);
            }
            52.5% {
                transform: translate(600px, 320px);
            }
            55% {
                transform: translate(400px, 400px);
            }
            57.5% {
                transform: translate(600px, 480px);
            }


            60% {
                transform: translate(600px, 0px);
            }
            62.5% {
                transform: translate(800px, 0px);
            }
            65% {
                transform: translate(600px, 80px);
            }
            67.5% {
                transform: translate(800px, 160px);
            }
            70% {
                transform: translate(600px, 240px);
            }
            72.5% {
                transform: translate(800px, 320px);
            }
            75% {
                transform: translate(600px, 400px);
            }
            77.5% {
                transform: translate(800px, 480px);
            }


            80% {
                transform: translate(800px, 0px);
            }
            82.5% {
                transform: translate(1000px, 0px);
            }
            85% {
                transform: translate(800px, 80px);
            }
            87.5% {
                transform: translate(1000px, 160px);
            }
            90% {
                transform: translate(800px, 240px);
            }
            92.5% {
                transform: translate(1000px, 320px);
            }
            95% {
                transform: translate(800px, 400px);
            }
            97.5% {
                transform: translate(1000px, 480px);
            }
            100% {
                transform: translate(1000px, 0px);
            }
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="container" id="a"></div>
        <div class="container" id="b"></div>
        <div class="container" id="c"></div>
        <div class="container" id="d"></div>
        <div class="container" id="e"></div>
        <div class="child"></div>
    </div>

</body>

</html>
