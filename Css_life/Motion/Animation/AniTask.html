<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: black;
            box-sizing: border-box;
        }
        html,body{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 600px;
            height: 400px;
            border: 2px white dotted;
        }
        .child{
            width: 100px;
            height: 100px;
            color: white;
            animation-name: pavi;
            animation-duration: 3s;
            /* animation-timing-function:ease-in-out; */
            animation-iteration-count: infinite;
            animation-direction: normal;
            /* animation-direction: alternate; */
            /* animation-direction: alternate-reverse; */
            background-color: cadetblue;
        }
        #a{
            border-top: none;
        }
        #b{
            border-bottom: none;
        }
        #c{
            border-top: none;
        }
        #d{
            border-bottom: none;
        }
        #e{
            border-top: none;
        }

        /* @keyframes pavi {
            from{
                transform: translate(0px,0px) rotate(0deg);
            }
            to{
                transform: translate(500px,0px) rotate(360deg);
            }
        } */
         @keyframes pavi {
            0%{
                transform: translate(0px,0px) 
            }
            10%{
                transform: translate(0px,300px)
            }
            20%{
                transform: translate(300px,300px)
            }
            30%{
                transform: translate(300px,0px)
            }
            40%{
                transform: translate(600px,0px)
            }
            50%{
                transform: translate(600px,300px)
            }
            55%{
                transform: translate(900px,300px)
            }
            60%{
                transform: translate(900px,0px)
            }
            70%{
                transform: translate(1200px,0px)
            }
            75%{
                transform: translate(1200px,300px)
            }
            90%{
                transform: translate(1500px,300px)
            }
             100%{
            transform: translate(1500px,0px)
            }  
         }
            
    </style>
</head>
<body>
    <div class="container" id="a">
        <div class="child">Box</div>
    </div>
    <div class="container" id="b"></div>
    <div class="container" id="c"></div>
    <div class="container" id="d"></div>
    <div class="container" id="e"></div>
</body>
</html>
