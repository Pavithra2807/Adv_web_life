<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            background-color: black;
            box-sizing: border-box;
        }
        html,body{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 600px;
            height: 400px;
            border: 2px white dotted;
        }
        .child{
            width: 100px;
            height: 100px;
            color: white;
            animation-name: pavi;
            animation-duration: 4s;
            background-color: cadetblue;
        }
        @keyframes pavi {
            from{
                transform: translate(0px,0px);
            }
            to{
                transform: translate(500px,0px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child">
            Box
        </div>
    </div>
</body>
</html>
